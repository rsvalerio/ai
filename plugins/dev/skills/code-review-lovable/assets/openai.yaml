# Agent settings
model: gpt-4o
temperature: 0.2
max_tokens: 16384
display_name: Lovable Stack Code Review
short_description: Review Lovable-style apps (Vite + React + shadcn/ui + Tailwind on Supabase or Lovable Cloud, TanStack Query, Zustand, zod, Shopify Storefront) for RLS gaps, supabase-js and GraphQL error handling, Edge Function auth and value minting, cache-key bleed, price truth, client-only validation, design-token drift and scaffold hygiene. Overlay on code-review-web.
default_prompt: "Run a formal code-review-lovable. Confirm the stack fingerprints (Lovable Cloud, Shopify), read .lovable/plan.md, replay supabase/migrations to the final schema, then scan migrations, supabase/functions, config.toml and src/ against RLS, SUPA, AUTH, EDGE, QRY, FORM, UI, SHOP and LOV; leave generic React/TS findings to code-review-web; create one backlog task per finding via CLI; print a summary table."
