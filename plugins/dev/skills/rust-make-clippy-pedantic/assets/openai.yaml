# Agent settings
model: gpt-4o
temperature: 0.2
max_tokens: 16384
display_name: Make Clippy Pedantic
short_description: Lint a clean Rust checkout at pedantic strength without modifying it, file one backlog task per warning (generated files and out-of-tree warnings dropped, the policy's four in-tests lints exempt in test code, high-volume lints aggregated per crate), estimate the cleanup effort, and show — or with --apply write — the matching Cargo.toml and clippy.toml lint policy.
default_prompt: "Run rust-make-clippy-pedantic. Verify the git tree is clean, take a default-level baseline with ops clippy-findings --schema-version 2 (cargo clippy under --locked, one normalized camelCase JSON row per diagnostic; requires ops 0.74.0 or newer), build into a scratch directory under the user cache directory that ops about machine confirms is not tmpfs and delete it when the run ends, render the Rust foundation with ops init --rust into a scratch crate (never the repository), leave out every lint ops init --rust --check reports as waived and list those in the report, and re-run it with the foundation lint policy passed as -W flags after -- and CLIPPY_CONF_DIR pointing at the foundation clippy.toml built in scratch, create one backlog task per finding labelled pedantic with --modified-file set and a full-row --unless-exists key — dropping generated files and out-of-tree warnings, and never discarding a row for being in test code, since Clippy already applied the allow-*-in-tests keys, and aggregating any lint that fires more than twenty times in one crate into a single task — then report what ran, what was filed, and a high-level effort estimate, and finish by printing the foundation Cargo.toml and clippy.toml lint policy that would make the strictness permanent, limited to what ops init --rust --check reports as drift — writing those files only if --apply was passed."
