# rumdl configuration for rust-skills
# https://rumdl.dev/configuration/

[global]
# pull_request_template.md opens with a section heading by design, not MD041's H1.
exclude = ["target", ".git", ".github/pull_request_template.md"]

disable = [
    "MD013", # Line length
    "MD033" # Bare URL
]

[MD007]
indent = 2
