# Agent settings
model: gpt-4o
temperature: 0.2
max_tokens: 16384
display_name: Make Clippy Pedantic
short_description: Lint a clean Rust checkout at pedantic strength without modifying it, file one backlog task per warning, and estimate the cleanup effort.
default_prompt: "Run rust-make-clippy-pedantic. Verify the git tree is clean, take a default-level clippy baseline, re-run cargo clippy with -W clippy::pedantic -W clippy::nursery -W clippy::cargo passed as flags after --, create one backlog task per finding labelled pedantic with --modified-file set, then report what ran, what was filed, and a high-level effort estimate."
