# Agent settings
model: gpt-4o
temperature: 0.2
max_tokens: 16384
display_name: Make Clippy Pedantic
short_description: Lint a clean Rust checkout at pedantic strength without modifying it, file one backlog task per warning (test-only style findings, generated files and out-of-tree warnings dropped, high-volume lints aggregated per crate), estimate the cleanup effort, and show — or with --apply write — the matching Cargo.toml and clippy.toml lint policy.
default_prompt: "Run rust-make-clippy-pedantic. Verify the git tree is clean, take a default-level baseline with cargo clippy --workspace --all-targets --locked, re-run the same command with -W clippy::pedantic -W clippy::nursery -W clippy::cargo passed as flags after --, create one backlog task per finding labelled pedantic with --modified-file set — dropping test-only style findings, generated files and out-of-tree warnings, and aggregating any lint that fires more than twenty times in one crate into a single task — then report what ran, what was filed, and a high-level effort estimate, and finish by printing the Cargo.toml and clippy.toml lint policy that would make the strictness permanent — writing those files only if --apply was passed."
