name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise reads .tool-versions directly — the same file `make check-tools`
      # reads locally, so CI and a developer machine install identical versions.
      # skill-validator ships as GitHub release assets rather than a crates.io
      # crate, which is why it is pinned through mise's `github:` backend.
      - uses: jdx/mise-action@v2

      - name: Confirm tooling matches .tool-versions
        run: make check-tools

      - name: Check formatting
        run: make fmt-check

      - name: Check lint rules
        run: make lint-check

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Confirm tooling matches .tool-versions
        run: make check-tools

      - name: Validate all agent skills
        run: make validate

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link skills into the agent directory
        run: make link

      - name: Verify every skill resolves to a SKILL.md
        run: |
          set -e
          for skill in skills/*/; do
            name=$(basename "$skill")
            test -f "$HOME/.claude/skills/$name/SKILL.md" \
              || { echo "::error::$name did not link to a readable SKILL.md"; exit 1; }
          done

      - name: Unlink skills
        run: make unlink
