name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      rumdl: ${{ steps.read.outputs.rumdl }}
      skill-validator: ${{ steps.read.outputs.skill-validator }}
    steps:
      - uses: actions/checkout@v7

      # .tool-versions is the same file `make check-tools` reads locally.
      - name: Read pinned tool versions
        id: read
        run: |
          set -euo pipefail
          for tool in rumdl skill-validator; do
            version=$(awk -v t="$tool" '$1 == t || $1 ~ "/" t "$" { print $2 }' .tool-versions)
            test -n "$version" || { echo "::error::$tool missing from .tool-versions"; exit 1; }
            echo "$tool=$version" >> "$GITHUB_OUTPUT"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7

      - name: Install rumdl
        uses: taiki-e/install-action@v2
        with:
          tool: rumdl@${{ needs.versions.outputs.rumdl }}

      - name: Check formatting
        run: make fmt-check

      - name: Check lint rules
        run: make lint-check

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7

      - name: Install skill-validator
        uses: taiki-e/install-action@v2
        with:
          tool: skill-validator@${{ needs.versions.outputs.skill-validator }}

      - name: Validate all agent skills
        run: make validate

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link skills into the agent directory
        run: make link

      - name: Verify every skill resolves to a SKILL.md
        run: |
          set -e
          for skill in skills/*/; do
            name=$(basename "$skill")
            test -f "$HOME/.claude/skills/$name/SKILL.md" \
              || { echo "::error::$name did not link to a readable SKILL.md"; exit 1; }
          done

      - name: Unlink skills
        run: make unlink
