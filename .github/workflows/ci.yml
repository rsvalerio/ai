name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads .tool-versions directly — the same file `make check-tools`
      # reads locally, so CI and a developer machine install identical versions.
      # skill-validator ships as GitHub release assets rather than a crates.io
      # crate, which is why it is pinned through mise's `github:` backend.
      - uses: jdx/mise-action@v4

      - name: Confirm tooling matches .tool-versions
        run: make check-tools

      - name: Check formatting
        run: make fmt-check

      - name: Check lint rules
        run: make lint-check

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Confirm tooling matches .tool-versions
        run: make check-tools

      - name: Validate all agent skills
        run: make validate

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    steps:
      # This job npm-installs third-party code after checkout; do not leave the
      # repo token in git config for those steps to see.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # claude-code stays out of .tool-versions on purpose: mise's registry
      # does not know the tool, so an entry would fail `mise install` in CI.
      # The pin below is the one place a version is hardcoded outside
      # .tool-versions — bump it alongside Claude Code releases. Locally, any
      # recent claude-code on PATH works (CONTRIBUTING.md has the asdf route).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned claude-code
        run: npm install -g @anthropic-ai/claude-code@2.1.235

      - name: Validate the plugin marketplace manifest
        run: make validate-marketplace

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link skills into the agent directory
        run: make link

      - name: Verify every skill resolves to a SKILL.md
        run: |
          set -e
          for skill in skills/*/; do
            name=$(basename "$skill")
            test -f "$HOME/.claude/skills/$name/SKILL.md" \
              || { echo "::error::$name did not link to a readable SKILL.md"; exit 1; }
          done

      - name: Unlink skills
        run: make unlink
