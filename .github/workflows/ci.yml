name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates are defined once in .ops.toml: these jobs run exactly what a developer or
  # a wave runner runs locally, so a check is added there and nowhere else. verify is
  # the fast offline gate and reports first; qa is the full gate and repeats verify's
  # checks, which cost under a second.
  verify:
    name: ops verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise reads .tool-versions directly — the same file `make check-tools`
      # reads locally, so CI and a developer machine install identical versions.
      # skill-validator ships as GitHub release assets rather than a crates.io
      # crate, which is why it is pinned through mise's `github:` backend.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      # The ops that runs the gates: 0.75.0 or newer for the `lint-actions` built-in, never
      # below the skills' ops floor (AGENTS.md "ops dependency"), and equal on both jobs.
      # Nothing bumps it automatically. setup-ops is SHA-pinned like any third-party
      # action (forge's own docs use @v1), so Dependabot moves it with its comment.
      - name: Install ops
        uses: rsvalerio/forge/actions/setup-ops@e63b91a8c5f245be0885f453d1d77722151ef182 # v1
        with:
          version: 0.75.0

      # Every check .ops.toml lists under [commands.verify]; see there for what each does.
      - name: ops verify
        run: ops verify

  qa:
    name: ops qa
    runs-on: ubuntu-latest
    steps:
      # This job npm-installs third-party code after checkout; do not leave the
      # repo token in git config for those steps to see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      # claude-code stays out of .tool-versions on purpose: mise's registry
      # does not know the tool, so an entry would fail `mise install` in CI.
      # The pin below is the one place a version is hardcoded outside
      # .tool-versions — bump it alongside Claude Code releases. Locally, any
      # recent claude-code on PATH works (CONTRIBUTING.md has the asdf route).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned claude-code
        run: npm install -g @anthropic-ai/claude-code@2.1.235

      - name: Install ops
        uses: rsvalerio/forge/actions/setup-ops@e63b91a8c5f245be0885f453d1d77722151ef182 # v1
        with:
          version: 0.75.0

      # Every check .ops.toml lists under [commands.qa]: verify, the marketplace
      # manifests, and the make link / make unlink install path.
      - name: ops qa
        run: ops qa
